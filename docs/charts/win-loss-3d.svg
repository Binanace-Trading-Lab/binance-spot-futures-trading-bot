<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-label="3D win loss mix tuned vs default">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161c"/><stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="rTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="rSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="860" height="340" rx="18" fill="url(#bg)"/>
  <text x="430" y="36" text-anchor="middle" fill="#e8eaf2" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Win / loss mix  3D pie (illustrative)</text>
  <text x="430" y="56" text-anchor="middle" fill="#8b93a7" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="11">Green = wins / profit sleeve · Red = losses</text>

  <!-- Tuned pie -->
  <g transform="translate(215,195)" filter="url(#soft)">
    <ellipse cx="0" cy="18" rx="118" ry="46" fill="#0a0c10"/>
    <path d="M-118,6 C-118,31 -65,46 0,46 C65,46 118,31 118,6 L118,18 C118,43 65,58 0,58 C-65,58 -118,43 -118,18 Z" fill="url(#rSide)"/>
    <path d="M-118,6 C-118,18 -90,32 -40,40 L-40,18 C-90,10 -118,-2 -118,6 Z" fill="url(#gSide)"/>
    <ellipse cx="0" cy="6" rx="118" ry="46" fill="#1c1917"/>
    <path d="M0,6 L0,-40 A118,46 0 1 1 -28,48 Z" fill="url(#gTop)"/>
    <path d="M0,6 L-28,48 A118,46 0 0 1 0,-40 Z" fill="url(#rTop)"/>
    <ellipse cx="0" cy="6" rx="48" ry="18" fill="#0b0e11"/>
  </g>
  <text x="215" y="292" text-anchor="middle" fill="#e8eaf2" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Tuned scenario</text>
  <text x="215" y="312" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">Wins 54.4%</text>
  <text x="215" y="328" text-anchor="middle" fill="#f87171" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">Losses 45.6%</text>

  <!-- Default pie -->
  <g transform="translate(645,195)" filter="url(#soft)">
    <ellipse cx="0" cy="18" rx="118" ry="46" fill="#0a0c10"/>
    <path d="M-118,6 C-118,31 -65,46 0,46 C65,46 118,31 118,6 L118,18 C118,43 65,58 0,58 C-65,58 -118,43 -118,18 Z" fill="url(#rSide)"/>
    <path d="M-118,6 C-118,18 -95,30 -50,38 L-50,16 C-95,8 -118,-2 -118,6 Z" fill="url(#gSide)"/>
    <ellipse cx="0" cy="6" rx="118" ry="46" fill="#1c1917"/>
    <path d="M0,6 L0,-40 A118,46 0 1 1 -8,51 Z" fill="url(#gTop)"/>
    <path d="M0,6 L-8,51 A118,46 0 0 1 0,-40 Z" fill="url(#rTop)"/>
    <ellipse cx="0" cy="6" rx="48" ry="18" fill="#0b0e11"/>
  </g>
  <text x="645" y="292" text-anchor="middle" fill="#e8eaf2" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Default-like</text>
  <text x="645" y="312" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">Wins 51.2%</text>
  <text x="645" y="328" text-anchor="middle" fill="#f87171" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">Losses 48.8%</text>
</svg>
