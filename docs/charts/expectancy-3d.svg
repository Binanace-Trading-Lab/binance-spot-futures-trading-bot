<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="3D expectancy bars vs breakout buffer">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141922"/><stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
    <linearGradient id="frontG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="frontPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/><stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="frontLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="barSh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="4" dy="10" stdDeviation="6" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="860" height="380" rx="18" fill="url(#bg2)"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Expectancy vs breakoutBufferPct  3D bars</text>
  <text x="430" y="54" text-anchor="middle" fill="#8b93a7" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="11">Green = positive EV · Red = fee-eaten / too-tight buffer · Peak at 0.18</text>

  <!-- floor -->
  <polygon points="70,330 790,330 820,300 100,300" fill="#151a21" stroke="#2a3340"/>
  <line x1="88" y1="80" x2="88" y2="318" stroke="#334155" stroke-width="1"/>
  <text x="78" y="86" text-anchor="end" fill="#94a3b8" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">16</text>
  <text x="78" y="200" text-anchor="end" fill="#94a3b8" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">8</text>
  <text x="78" y="318" text-anchor="end" fill="#94a3b8" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">0</text>
  <text x="28" y="200" fill="#8b93a7" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" transform="rotate(-90 28 200)">EV / trade (USD)</text>

  <!-- bars: values 1.2, 5.4, 3.4, 12.1, 6.8  max 16, plot height 220 -->
  <!-- h = v/16*220 ; x positions 150, 280, 410, 540, 670 -->
  <g filter="url(#barSh)">
    <!-- 1.2 red-ish weak -->
    <g>
      <polygon points="150,313.5 198,313.5 214,301.5 166,301.5" fill="#991b1b"/>
      <polygon points="198,313.5 214,301.5 214,285 198,297" fill="#7f1d1d"/>
      <rect x="150" y="297" width="48" height="16.5" fill="url(#frontLow)"/>
      <polygon points="150,297 198,297 214,285 166,285" fill="#fca5a5"/>
    </g>
    <!-- 5.4 -->
    <g>
      <polygon points="280,255.75 328,255.75 344,243.75 296,243.75" fill="#166534"/>
      <polygon points="328,255.75 344,243.75 344,169.5 328,181.5" fill="#14532d"/>
      <rect x="280" y="181.5" width="48" height="74.25" fill="url(#frontG)"/>
      <polygon points="280,181.5 328,181.5 344,169.5 296,169.5" fill="#86efac"/>
    </g>
    <!-- 3.4 -->
    <g>
      <polygon points="410,283.25 458,283.25 474,271.25 426,271.25" fill="#166534"/>
      <polygon points="458,283.25 474,271.25 474,224.25 458,236.25" fill="#14532d"/>
      <rect x="410" y="236.25" width="48" height="47" fill="url(#frontG)"/>
      <polygon points="410,236.25 458,236.25 474,224.25 426,224.25" fill="#4ade80"/>
    </g>
    <!-- 12.1 peak -->
    <g>
      <polygon points="540,163.6 588,163.6 604,151.6 556,151.6" fill="#15803d"/>
      <polygon points="588,163.6 604,151.6 604,89.4 588,101.4" fill="#166534"/>
      <rect x="540" y="101.4" width="48" height="166.4" fill="url(#frontPeak)"/>
      <polygon points="540,101.4 588,101.4 604,89.4 556,89.4" fill="#bbf7d0"/>
    </g>
    <!-- 6.8 -->
    <g>
      <polygon points="670,236.5 718,236.5 734,224.5 686,224.5" fill="#166534"/>
      <polygon points="718,236.5 734,224.5 734,162.5 718,174.5" fill="#14532d"/>
      <rect x="670" y="174.5" width="48" height="93.5" fill="url(#frontG)"/>
      <polygon points="670,174.5 718,174.5 734,162.5 686,162.5" fill="#86efac"/>
    </g>
  </g>

  <text x="174" y="352" text-anchor="middle" fill="#f87171" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">0.08</text>
  <text x="304" y="352" text-anchor="middle" fill="#86efac" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">0.12</text>
  <text x="434" y="352" text-anchor="middle" fill="#86efac" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">0.15</text>
  <text x="564" y="352" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">0.18</text>
  <text x="694" y="352" text-anchor="middle" fill="#86efac" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">0.25</text>
  <text x="430" y="372" text-anchor="middle" fill="#8b93a7" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">breakoutBufferPct</text>
</svg>
