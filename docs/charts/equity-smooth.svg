<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Smooth equity curves tuned vs default">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
